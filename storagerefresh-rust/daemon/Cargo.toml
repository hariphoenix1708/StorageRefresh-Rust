[package]
name = "storagerefresh-rust"
version = "0.2.0"
edition = "2021"
authors = ["Google Jules <jules@example.com>"]
description = "Independent open-source periodic storage maintenance (TRIM) module"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
nix = { version = "0.29", features = ["ioctl", "fs"] }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
